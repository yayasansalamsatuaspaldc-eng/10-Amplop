<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemilihan Kel Alm - Santunan YASSA</title>
<style>
  :root{
    --bg:#E0E5EC;
    --shadow-out: 9px 9px 16px rgba(163,177,198,0.6), -9px -9px 16px rgba(255,255,255,0.8);
    --shadow-in: inset 4px 4px 8px rgba(163,177,198,0.6), inset -4px -4px 8px rgba(255,255,255,0.8);
    --blue:#2563eb;
    --amber:#b45309;
    --text-main:#1e293b;
    --text-sub:#64748b;
    --text-faint:#94a3b8;
    --text-label:#475569;
  }
  html[data-theme="dark"]{
    --bg:#262b36;
    --shadow-out: 9px 9px 16px rgba(0,0,0,0.55), -9px -9px 16px rgba(60,67,84,0.5);
    --shadow-in: inset 4px 4px 8px rgba(0,0,0,0.55), inset -4px -4px 8px rgba(60,67,84,0.5);
    --blue:#60a5fa;
    --amber:#fbbf24;
    --text-main:#e6e9f0;
    --text-sub:#a3acc0;
    --text-faint:#78829a;
    --text-label:#c3cadb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:16px; background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--text-main);
    transition: background .2s ease, color .2s ease;
  }
  .container{max-width:640px; margin:0 auto;}
  h1{font-size:18px; font-weight:800; text-align:center; margin:8px 0 4px;}
  .subtitle{text-align:center; font-size:12px; color:var(--text-sub); margin-bottom:20px;}

  .theme-toggle{
    display:block; margin:0 auto 14px; padding:9px 18px; border:none; border-radius:14px;
    background:var(--bg); box-shadow:var(--shadow-out);
    font-size:12px; font-weight:700; color:var(--text-label); cursor:pointer;
  }
  .theme-toggle:active{ box-shadow:var(--shadow-in); }

  .card{
    background:var(--bg); border-radius:20px; box-shadow:var(--shadow-out);
    padding:18px; margin-bottom:16px;
  }
  label{font-size:12px; font-weight:700; color:var(--text-label); display:block; margin-bottom:6px;}
  select, input[type=text]{
    width:100%; padding:12px 14px; border:none; border-radius:14px;
    background:var(--bg); box-shadow:var(--shadow-in); font-size:14px; color:var(--text-main);
    outline:none; appearance:none;
  }

  .section-title{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-sub); margin: 18px 0 8px;
  }
  .section-title.lanjutan{color:var(--amber);}
  .section-title.terpilih{color:var(--blue);}

  .item{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:14px; background:var(--bg);
    box-shadow:var(--shadow-out); margin-bottom:8px; cursor:pointer;
    transition: box-shadow .15s;
  }
  .item.selected{ box-shadow:var(--shadow-in); }
  .item input[type=checkbox]{ width:20px; height:20px; flex-shrink:0; accent-color:var(--blue); }
  .item .info{flex:1; min-width:0;}
  .item .nama{font-weight:700; font-size:13.5px; color:var(--text-main);}
  .item .meta{font-size:11px; color:var(--text-sub); margin-top:2px;}
  .badge-lama{
    font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px;
    background:#fef3c7; color:#92400e; white-space:nowrap;
  }
  .badge-baru{
    font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px;
    background:#dcfce7; color:#166534; white-space:nowrap;
  }
  .badge-wajib{
    font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px;
    background:#fee2e2; color:#991b1b; white-space:nowrap;
  }
  .item.wajib-amplop{ border-left:3px solid #dc2626; }

  .item-terpilih{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:12px; background:var(--bg);
    box-shadow:var(--shadow-in); margin-bottom:6px;
  }
  .item-terpilih .no{
    font-weight:800; font-size:12px; color:var(--blue); width:20px; flex-shrink:0;
  }
  .item-terpilih .nama{ flex:1; font-weight:700; font-size:13px; color:var(--text-main); }
  .item-terpilih .hapus{
    border:none; background:transparent; color:#dc2626; font-weight:800;
    font-size:16px; cursor:pointer; padding:2px 8px; line-height:1;
  }

  .empty-msg{ text-align:center; font-size:12.5px; color:var(--text-faint); padding:20px 0; }

  button.submit-btn{
    width:100%; padding:16px; border:none; border-radius:16px;
    background:var(--bg); box-shadow:var(--shadow-out);
    font-weight:800; font-size:14px; color:var(--blue); cursor:pointer;
    margin-top:8px;
  }
  button.submit-btn:disabled{ color:var(--text-faint); cursor:not-allowed; }
  button.submit-btn:active:not(:disabled){ box-shadow:var(--shadow-in); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#1e293b; color:#fff; padding:12px 20px; border-radius:12px;
    font-size:13px; max-width:90%; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    z-index:999; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .toast.error{background:#991b1b;}

  .locked-screen{
    text-align:center; padding:40px 20px;
  }
  .locked-screen .icon{ font-size:48px; margin-bottom:12px; }
  .locked-screen h2{ font-size:16px; color:var(--text-main); margin:0 0 6px; }
  .locked-screen p{ font-size:12.5px; color:var(--text-sub); margin:0 0 4px; }
  .locked-overlay{
    position:fixed; inset:0; background:rgba(224,229,236,0.01);
    z-index:500; cursor:not-allowed;
  }

  .loading{ text-align:center; font-size:12.5px; color:var(--text-faint); padding:16px 0; }
  .spinner{
    display:inline-block; width:16px; height:16px; border:2px solid #cbd5e1;
    border-top-color: var(--blue); border-radius:50%; animation:spin .7s linear infinite;
    margin-right:8px; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ===================== TUTORIAL: COACH MARK TOUR (seperti YASSA Hub) ===================== */
  .coach-dim{
    position:fixed; inset:0; z-index:3000;
    background:rgba(15,23,42,0.72);
    transition: clip-path .25s ease;
  }
  .coach-highlight{
    position:fixed; z-index:3001; border-radius:16px;
    box-shadow:0 0 0 4px #fff, 0 0 0 9999px rgba(15,23,42,0.72);
    pointer-events:none; transition: all .25s ease;
  }
  .coach-card{
    position:fixed; z-index:3002; background:#fff; border-radius:18px;
    padding:18px 20px; width:290px; max-width:84vw;
    box-shadow:0 16px 34px rgba(0,0,0,0.35);
    transition: top .25s ease, left .25s ease;
  }
  .coach-card .coach-top{
    display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;
  }
  .coach-card h3{ font-size:15px; font-weight:800; color:#0f172a; margin:0; }
  .coach-card .coach-skip{
    font-size:12px; font-weight:700; color:#64748b; cursor:pointer; white-space:nowrap; margin-left:10px;
  }
  .coach-card p{ font-size:12.5px; color:#475569; line-height:1.55; margin:0 0 16px; }
  .coach-card .coach-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .coach-card .coach-count{ font-size:12px; color:#94a3b8; font-weight:700; }
  .coach-card .coach-next{
    font-size:14px; font-weight:800; color:#16a34a; background:none; border:none; cursor:pointer; padding:4px;
  }

  /* ===================== TOMBOL BANTUAN (!) PER FIELD ===================== */
  label{ display:flex; align-items:center; gap:6px; }
  .help-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    background:var(--amber); color:#fff; font-size:11px; font-weight:800;
    cursor:pointer; line-height:1; border:none; padding:0;
  }
  .help-popover{
    position:fixed; z-index:3100; background:#1e293b; color:#fff;
    border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.5;
    width:240px; max-width:78vw; box-shadow:0 10px 24px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="container">
  <button type="button" class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙 Mode Gelap</button>
  <h1>🕊️ Pemilihan Kel Alm</h1>
  <div class="subtitle" id="periodeLabel">Rotasi Santunan Amplop Bulanan</div>
  <div style="text-align:center; margin-bottom:14px;">
    <span onclick="startCoachTour()" style="font-size:11.5px; font-weight:700; color:var(--blue); cursor:pointer; text-decoration:underline;">📖 Lihat tutorial cara pakai</span>
  </div>

  <div class="card">
    <label for="wilayahSelect">Pilih Wilayah
      <button type="button" class="help-icon" onclick="showFieldHelp(this, event, 'Mulai dengan memilih wilayah Anda di sini. Daftar Kel Alm dan nama Korwil akan otomatis dimuat.')">!</button>
    </label>
    <select id="wilayahSelect" onchange="onWilayahChange()">
      <option value="">-- Pilih Wilayah --</option>
    </select>
  </div>

  <div class="card" id="korwilCard" style="display:none;">
    <label for="korwilInput">Nama Korwil (Wajib diisi untuk jejak audit)
      <button type="button" class="help-icon" onclick="showFieldHelp(this, event, 'Nama Korwil akan otomatis terisi setelah wilayah dipilih. Pastikan namanya sudah benar — kolom ini wajib diisi sebelum submit.')">!</button>
    </label>
    <input type="text" id="korwilInput" placeholder="Contoh: Budi Santoso">
  </div>

  <div class="card" id="searchCard" style="display:none;">
    <label for="searchInput">🔍 Cari Nama ALM
      <button type="button" class="help-icon" onclick="showFieldHelp(this, event, 'Gunakan kotak ini untuk mencari nama Kel Alm dengan cepat jika daftarnya panjang.')">!</button>
    </label>
    <input type="text" id="searchInput" placeholder="Ketik nama untuk mencari..." onkeyup="filterPencarian()">
  </div>

  <div id="listArea"></div>

  <div id="terpilihArea"></div>

  <div style="text-align:center; margin-bottom:6px;">
    <button type="button" class="help-icon" style="background:var(--blue);" onclick="showFieldHelp(this, event, 'Tombol ini aktif setelah tepat 10 KK terpilih. Setelah submit berhasil, layar akan terkunci dan tidak bisa diubah lagi.')">!</button>
  </div>
  <button class="submit-btn" id="submitBtn" onclick="submitPilihan()" disabled>
    Pilih tepat 10 KK untuk submit
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===========================================================
// GANTI DENGAN URL WEB APP APPS SCRIPT KAMU (diakhiri /exec)
// Deploy > Manage deployments > (ikon copy di kolom Web app)
// ===========================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxNHEyje-MrlAbOKIrDy8YRTJ4Jltmo3xdpL1_5dGgvF-KuEWfH31uc-xUVJhTmd19U_A/exec';

const JUMLAH_WAJIB = 10;
let currentData = null;
let selectedIds = new Set();
let allItemsMap = {};
let isLocked = false;

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

// ---------------------------------------------------------
// HELPER: PANGGIL API (GANTI google.script.run)
// ---------------------------------------------------------
async function apiGet(action, params){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));

  const res = await fetch(url.toString(), { method: 'GET' });
  const json = await res.json();
  if (!json.success) throw new Error(json.message || 'Terjadi kesalahan.');
  return json.data;
}

async function apiPost(action, payload){
  // Content-Type text/plain WAJIB dipakai supaya browser tidak kirim
  // preflight OPTIONS (Apps Script Web App tidak bisa menjawab OPTIONS).
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, payload: payload })
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.message || 'Gagal menyimpan.');
  return json.data;
}

// ---------------------------------------------------------
// MODE GELAP / TERANG
// ---------------------------------------------------------
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  btn.textContent = theme === 'dark' ? '☀️ Mode Terang' : '🌙 Mode Gelap';
  try { localStorage.setItem('yassaTheme', theme); } catch(e){}
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('yassaTheme'); } catch(e){}
  if (!saved){
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(saved);
}

// ---------------------------------------------------------
// INIT
// ---------------------------------------------------------
initTheme();
window.onload = function(){
  apiGet('getWilayahOptions')
    .then(populateWilayah)
    .catch(onError);
  setTimeout(startCoachTour, 400); // beri jeda agar elemen sudah siap dirender
};

// ---------------------------------------------------------
// TUTORIAL: COACH MARK TOUR (kartu + spotlight, gaya sama seperti YASSA Hub)
// ---------------------------------------------------------
const coachSteps = [
  {
    target: null,
    title: 'Selamat Datang 👋',
    desc: 'Halaman ini dipakai untuk memilih 10 KK Kel Alm yang akan menerima santunan bulan ini. Ikuti tur singkat berikut.'
  },
  {
    target: 'wilayahSelect',
    title: 'Pilih Wilayah',
    desc: 'Mulai dengan memilih wilayah Anda di sini. Daftar Kel Alm dan nama Korwil akan otomatis dimuat.'
  },
  {
    target: null,
    title: 'Nama Korwil',
    desc: 'Setelah wilayah dipilih, kolom Nama Korwil akan muncul dan biasanya terisi otomatis. Pastikan namanya sudah benar — kolom ini wajib diisi.'
  },
  {
    target: null,
    title: 'Cari & Pilih Kel Alm',
    desc: 'Daftar Kel Alm akan tampil lengkap dengan kotak pencarian. Ketuk nama atau centang kotaknya untuk memilih. Yang berlabel ⚠ Wajib Amplop harus diprioritaskan karena tidak punya rekening bank.'
  },
  {
    target: null,
    title: 'Pastikan Tepat 10 KK',
    desc: 'Bagian "KK Terpilih" menunjukkan siapa saja yang sudah dipilih. Ketuk ✕ untuk membatalkan salah satu pilihan.'
  },
  {
    target: 'submitBtn',
    title: 'Submit',
    desc: 'Tombol ini aktif setelah tepat 10 KK terpilih. Setelah submit berhasil, layar akan terkunci dan tidak bisa diubah lagi.'
  }
];
let coachIndex = 0;
let coachEls = null;

function startCoachTour(){
  if (isLocked) return;
  coachIndex = 0;
  buildCoachDom();
  renderCoachStep();
}

function buildCoachDom(){
  if (coachEls) return;
  const dim = document.createElement('div');
  dim.className = 'coach-dim';
  const highlight = document.createElement('div');
  highlight.className = 'coach-highlight';
  const card = document.createElement('div');
  card.className = 'coach-card';
  card.innerHTML =
    '<div class="coach-top"><h3 id="coachTitle"></h3><span class="coach-skip" onclick="endCoachTour()">Lewati</span></div>'
    + '<p id="coachDesc"></p>'
    + '<div class="coach-bottom"><span class="coach-count" id="coachCount"></span>'
    + '<button class="coach-next" id="coachNextBtn" onclick="nextCoachStep()">Lanjut</button></div>';
  document.body.appendChild(dim);
  document.body.appendChild(highlight);
  document.body.appendChild(card);
  coachEls = { dim, highlight, card };
}

function renderCoachStep(){
  const step = coachSteps[coachIndex];
  const total = coachSteps.length;

  document.getElementById('coachTitle').textContent = step.title;
  document.getElementById('coachDesc').textContent = step.desc;
  document.getElementById('coachCount').textContent = (coachIndex + 1) + '/' + total;
  document.getElementById('coachNextBtn').textContent = (coachIndex === total - 1) ? 'Selesai' : 'Lanjut';

  const targetEl = step.target ? document.getElementById(step.target) : null;
  const vw = window.innerWidth, vh = window.innerHeight;
  const cardW = 290;

  if (targetEl && targetEl.offsetParent !== null){
    const r = targetEl.getBoundingClientRect();
    const pad = 8;
    coachEls.highlight.style.display = 'block';
    coachEls.highlight.style.left = (r.left - pad) + 'px';
    coachEls.highlight.style.top = (r.top - pad) + 'px';
    coachEls.highlight.style.width = (r.width + pad * 2) + 'px';
    coachEls.highlight.style.height = (r.height + pad * 2) + 'px';

    const spaceBelow = vh - r.bottom;
    const cardTop = spaceBelow > 200 ? (r.bottom + pad + 10) : Math.max(16, r.top - pad - 10 - 160);
    const cardLeft = Math.min(Math.max(16, r.left), vw - cardW - 16);
    coachEls.card.style.top = cardTop + 'px';
    coachEls.card.style.left = cardLeft + 'px';
  } else {
    coachEls.highlight.style.display = 'none';
    coachEls.card.style.top = (vh / 2 - 110) + 'px';
    coachEls.card.style.left = Math.max(16, (vw - cardW) / 2) + 'px';
  }
}

function nextCoachStep(){
  if (coachIndex >= coachSteps.length - 1){
    endCoachTour();
    return;
  }
  coachIndex++;
  renderCoachStep();
}

function endCoachTour(){
  if (!coachEls) return;
  coachEls.dim.remove();
  coachEls.highlight.remove();
  coachEls.card.remove();
  coachEls = null;
}

// ---------------------------------------------------------
// TOMBOL BANTUAN (!) PER FIELD: popover kecil dekat tombol yang ditekan
// ---------------------------------------------------------
let activeHelpPopover = null;

function showFieldHelp(btnEl, evt, text){
  evt.stopPropagation();
  // Jika popover sedang tampil di tombol yang sama, tutup (toggle)
  if (activeHelpPopover && activeHelpPopover._btn === btnEl){
    closeFieldHelp();
    return;
  }
  closeFieldHelp();

  const pop = document.createElement('div');
  pop.className = 'help-popover';
  pop.textContent = text;
  document.body.appendChild(pop);
  pop._btn = btnEl;

  const r = btnEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const popW = 240;
  let left = r.left - 8;
  left = Math.min(Math.max(12, left), vw - popW - 12);
  const spaceBelow = vh - r.bottom;
  const top = spaceBelow > 100 ? (r.bottom + 8) : (r.top - 8 - 90);

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  activeHelpPopover = pop;

  setTimeout(() => { document.addEventListener('click', onOutsideHelpClick); }, 0);
}

function onOutsideHelpClick(e){
  if (activeHelpPopover && !activeHelpPopover.contains(e.target) && e.target !== activeHelpPopover._btn){
    closeFieldHelp();
  }
}

function closeFieldHelp(){
  if (activeHelpPopover){
    activeHelpPopover.remove();
    activeHelpPopover = null;
  }
  document.removeEventListener('click', onOutsideHelpClick);
}

function populateWilayah(data){
  // DEBUGGING: Lacak data utuh yang datang saat halaman pertama kali dibuka
  console.log("Memuat data awal dari backend:", data);

  const sel = document.getElementById('wilayahSelect');
  
  // Karena backend sekarang mengirim object, daftar wilayah ada di data.wilayahList
  const list = data.wilayahList || [];
  
  list.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = w;
    sel.appendChild(opt);
  });
  
  // Update UI: Ubah subtitle "Rotasi Santunan Amplop Bulanan" menjadi teks Periode secara instan
  const periodeLabel = document.getElementById('periodeLabel');
  if (data.periode) {
    periodeLabel.innerHTML = 'Periode Santunan: <strong style="color:var(--blue); font-size:14px;">' + data.periode + '</strong>';
  }
  
  // Fitur Tambahan UI: Memunculkan peringatan pop-up di bawah jika status sudah ditutup dari awal
  if (data.status && data.status !== 'OPEN') {
     showToast('Info: Periode ' + data.periode + ' saat ini berstatus DITUTUP.', true);
  }
}

function onError(err){
  showToast(err.message || 'Terjadi kesalahan.', true);
  document.getElementById('listArea').innerHTML = '';
}

// ---------------------------------------------------------
// SAAT WILAYAH DIPILIH
// ---------------------------------------------------------
function onWilayahChange(){
  if (isLocked) return;
  const wilayah = document.getElementById('wilayahSelect').value;
  selectedIds = new Set();
  allItemsMap = {};
  document.getElementById('korwilCard').style.display = wilayah ? 'block' : 'none';
  document.getElementById('searchCard').style.display = 'none'; // Sembunyikan pencarian saat loading/ganti wilayah

  // --- TAMBAHAN: Autofill Nama Korwil Berdasarkan Wilayah ---
  try {
    // KAMUS DATA KORWIL: Silakan ganti teks di sebelah kanan (setelah titik dua) dengan nama Korwil yang asli
    const dataKorwil = {
      'BOGOR': 'Nama Korwil Bogor',
      'DEPOK': 'Nama Korwil Depok',
      'GRESIK': 'Nama Korwil Gresik',
      'JAKARTA TIMUR': 'Nama Korwil Jaktim',
      'JAKARTA SELATAN': 'Nama Korwil Jaksel',
      'JAKARTA BARAT': 'Nama Korwil Jakbar',
      'JAKARTA UTARA': 'Nama Korwil Jakut',
      'JAKARTA PUSAT': 'Nama Korwil Jakpus',
      'KABUPATEN BEKASI': 'Nama Korwil Kab Bekasi',
      'KOTA BEKASI': 'Nama Korwil Kota Bekasi',
      'SIDOARJO': 'Nama Korwil Sidoarjo',
      'SURABAYA': 'Nama Korwil Surabaya',
      'TANGGERANG KABUPATEN': 'Nama Korwil Kab Tangerang',
      'TANGGERANG SELATAN': 'Nama Korwil Tangsel',
      'TANGGERANG KOTA': 'Nama Korwil Kota Tangerang',
      'TASIKMALAYA': 'Nama Korwil Tasikmalaya'
    };

    const inputKorwil = document.getElementById('korwilInput');
    // Jika wilayah valid dan ada di kamus data, masukkan namanya ke kolom input
    if (wilayah && dataKorwil[wilayah]) {
      inputKorwil.value = dataKorwil[wilayah];
      console.log("Berhasil autofill Korwil: " + dataKorwil[wilayah] + " untuk wilayah " + wilayah);
    } else {
      inputKorwil.value = ''; // Kosongkan jika wilayah di-reset ke "-- Pilih Wilayah --"
    }
  } catch (err) {
    console.log("Error saat autofill nama Korwil: " + err.message);
  }
  // ----------------------------------------------------------

  if (!wilayah){
    document.getElementById('listArea').innerHTML = '';
    updateCounterAndButton();
    return;
  }

  document.getElementById('listArea').innerHTML = '<div class="loading"><span class="spinner"></span>Memuat data kel alm...</div>';
  updateCounterAndButton();

  apiGet('getDaftarKelAlm', { wilayah: wilayah })
    .then(onDataLoaded)
    .catch(onError);
}

function onDataLoaded(data){
  currentData = data;
  
  // DEBUGGING: Cek di console browser (F12) apakah API merespon dengan periode dan status yang benar dari Sheet
  console.log("Data dari backend memuat periode berjalan:", data.bulanTahunBerjalan);
  console.log("Status Periode dari backend:", data.statusPeriode);
  
  // Update UI: Memisahkan baris dan mempertegas gaya teks periode agar perubahan langsung terlihat jelas di layar
  const periodeLabel = document.getElementById('periodeLabel');
  periodeLabel.innerHTML = 
    'Periode Santunan: <strong style="color:var(--blue); font-size:14px;">' + (data.bulanTahunBerjalan || 'Belum Diisi') + '</strong><br>' +
    'Wilayah: <strong>' + data.wilayah + '</strong>';
    
  // --- TAMBAHAN: Cek Status Periode ---
  // Jika status bukan OPEN, langsung kunci layar dan hentikan proses render daftar nama
  if (data.statusPeriode !== 'OPEN') {
    showClosedScreen(data.wilayah, data.bulanTahunBerjalan);
    return; 
  }
  // ------------------------------------

  document.getElementById('searchCard').style.display = 'block'; // Tampilkan kotak pencarian
  document.getElementById('searchInput').value = ''; // Reset/Bersihkan isi kotak jika ada ketikan lama
  renderList();
}

// ---------------------------------------------------------
// FUNGSI BARU: KUNCI LAYAR JIKA STATUS PERIODE CLOSE
// ---------------------------------------------------------
function showClosedScreen(wilayah, periode){
  isLocked = true; // Mengunci agar fungsi onclick lain tidak berjalan

  // Sembunyikan input korwil dan nonaktifkan tombol submit
  document.getElementById('korwilCard').style.display = 'none';
  document.getElementById('searchCard').style.display = 'none'; // Sembunyikan kotak pencarian
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Periode Ditutup';

  // Tampilkan pesan peringatan berlogo gembok di area daftar nama
  document.getElementById('listArea').innerHTML =
    '<div class="card locked-screen">'
      + '<div class="icon">🔒</div>'
      + '<h2>Pengisian Santunan Ditutup</h2>'
      + '<p>Mohon maaf, pengisian data santunan wilayah <strong>' + escapeHtml(wilayah) + '</strong> untuk periode <strong>' + escapeHtml(periode) + '</strong> saat ini berstatus CLOSE (DITUTUP).</p>'
      + '<p>Silakan hubungi Admin jika Anda merasa ini adalah sebuah kesalahan.</p>'
    + '</div>';

  // Kosongkan area terpilih agar bersih
  document.getElementById('terpilihArea').innerHTML = '';
}

// ---------------------------------------------------------
// RENDER DAFTAR
// ---------------------------------------------------------
function renderList(){
  const area = document.getElementById('listArea');
  let html = '';

  if (currentData.daftarUtama.length === 0 && currentData.daftarLanjutan.length === 0){
    area.innerHTML = '<div class="card"><div class="empty-msg">Tidak ada kel alm aktif di wilayah ini.</div></div>';
    return;
  }

  html += '<div class="section-title">Daftar Utama (belum pernah / paling lama tidak dapat)</div>';
  html += '<div class="card">' + renderItems(currentData.daftarUtama) + '</div>';

  if (currentData.tampilkanLanjutan && currentData.daftarLanjutan.length > 0){
    html += '<div class="section-title lanjutan">Daftar Lanjutan (wajib amplop &amp; penggenap kekurangan 10)</div>';
    html += '<div class="card">' + renderItems(currentData.daftarLanjutan) + '</div>';
  }

  area.innerHTML = html;
  renderTerpilih();
}

function renderItems(items){
  items.forEach(k => { allItemsMap[k.id] = k; });

  const sisaItems = items.filter(k => !selectedIds.has(k.id));

  if (items.length === 0) return '<div class="empty-msg">Tidak ada data.</div>';
  if (sisaItems.length === 0) return '<div class="empty-msg">Semua KK di bagian ini sudah dipilih.</div>';

  return sisaItems.map((k, idx) => {
    const wajibClass = k.wajibAmplop ? ' wajib-amplop' : '';
    const badgeStatus = k.lastLabel
      ? '<span class="badge-lama">Terakhir: ' + k.lastLabel + '</span>'
      : '<span class="badge-baru">Belum pernah</span>';
    const badgeWajib = k.wajibAmplop ? '<span class="badge-wajib">⚠ Wajib Amplop</span>' : '';
    const badge = badgeWajib + badgeStatus;
    const metaParts = [];
    if (k.domisili) metaParts.push(k.domisili);
    if (k.rekening) { metaParts.push('Rek: ' + k.bank + ' •••' + k.rekening.slice(-4)); }
    else { metaParts.push('Tidak ada rekening (amplop)'); }

    return '<div class="item' + wajibClass + '" onclick="toggleItem(&quot;' + k.id + '&quot;)">'
      + '<input type="checkbox" onclick="event.stopPropagation(); toggleItem(&quot;' + k.id + '&quot;)">'
      + '<div class="info">'
        + '<div class="nama">' + (idx + 1) + '. ' + escapeHtml(k.nama) + '</div>'
        + '<div class="meta">' + escapeHtml(metaParts.join(' · ')) + '</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">' + badge + '</div>'
    + '</div>';
  }).join('');
}

// ---------------------------------------------------------
// RENDER RINGKASAN KK YANG SUDAH TERPILIH
// ---------------------------------------------------------
function renderTerpilih(){
  const area = document.getElementById('terpilihArea');
  if (selectedIds.size === 0){
    area.innerHTML = '';
    return;
  }

  const idsArray = Array.from(selectedIds);
  const rows = idsArray.map((id, i) => {
    const k = allItemsMap[id] || { nama: id };
    return '<div class="item-terpilih">'
      + '<span class="no">' + (i + 1) + '.</span>'
      + '<span class="nama">' + escapeHtml(k.nama) + '</span>'
      + '<button class="hapus" onclick="toggleItem(&quot;' + id + '&quot;)" title="Hapus dari pilihan">✕</button>'
    + '</div>';
  }).join('');

  area.innerHTML = '<div class="section-title terpilih">KK Terpilih (' + idsArray.length + '/' + JUMLAH_WAJIB + ')</div>'
    + '<div class="card">' + rows + '</div>';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---------------------------------------------------------
// TOGGLE CHECKBOX + VALIDASI TEPAT 10
// ---------------------------------------------------------
function toggleItem(id){
  if (isLocked) return;
  if (selectedIds.has(id)){
    selectedIds.delete(id);
  } else {
    if (selectedIds.size >= JUMLAH_WAJIB){
      showToast('Sudah 10 KK terpilih. Hapus salah satu dulu untuk mengganti.', true);
      return;
    }
    selectedIds.add(id);
  }
  renderList();
  filterPencarian(); // Aplikasikan ulang filter agar daftar tidak ter-reset secara visual saat nama diklik
  updateCounterAndButton();
}

function updateCounterAndButton(){
  const btn = document.getElementById('submitBtn');
  const count = selectedIds.size;
  const ok = count === JUMLAH_WAJIB;

  btn.disabled = !ok;
  btn.textContent = ok
    ? 'Submit ' + JUMLAH_WAJIB + ' KK Terpilih'
    : 'Pilih tepat ' + JUMLAH_WAJIB + ' KK (' + count + '/' + JUMLAH_WAJIB + ')';
}

// ---------------------------------------------------------
// SUBMIT
// ---------------------------------------------------------
function submitPilihan(){
  if (isLocked) return;
  const wilayah = document.getElementById('wilayahSelect').value;
  if (selectedIds.size !== JUMLAH_WAJIB){
    showToast('Wajib tepat ' + JUMLAH_WAJIB + ' KK.', true);
    return;
  }

  // --- TAMBAHAN: Validasi Nama Korwil Wajib Isi ---
  const korwilNameVal = document.getElementById('korwilInput').value.trim();
  if (korwilNameVal === '') {
    showToast('Nama Korwil wajib diisi sebelum submit!', true);
    document.getElementById('korwilInput').focus(); // Otomatis mengarahkan kursor ke kolom input
    return; // Menghentikan eksekusi kode agar data tidak terkirim ke server
  }
  // ------------------------------------------------

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  const selectedNamesMap = {};
  selectedIds.forEach(id => { selectedNamesMap[id] = (allItemsMap[id] || {}).nama || ''; });

  const payload = {
    wilayah: wilayah,
    selectedIds: Array.from(selectedIds),
    selectedNames: selectedNamesMap,
    korwilName: korwilNameVal // Memakai variabel yang sudah divalidasi di atas
  };

  apiPost('submitPemilihan', payload)
    .then(function(res){
      showLockedScreen(wilayah, selectedNamesMap, res.message);
    })
    .catch(function(err){
      showToast(err.message || 'Gagal menyimpan.', true);
      btn.disabled = false;
      updateCounterAndButton();
    });
}

// ---------------------------------------------------------
// KUNCI LAYAR SETELAH SUBMIT SUKSES
// Setelah pemilihan 10 KK berhasil disimpan, layar dikunci total:
// tidak bisa ganti wilayah, ubah pilihan, atau submit ulang.
// Satu-satunya cara "reset" adalah refresh/buka ulang halaman.
// ---------------------------------------------------------
function showLockedScreen(wilayah, selectedNamesMap, message){
  isLocked = true;

  // Overlay transparan yang menangkap semua tap/klik di seluruh layar,
  // termasuk elemen yang mungkin belum sempat ke-disable satu-satu.
  const overlay = document.createElement('div');
  overlay.className = 'locked-overlay';
  overlay.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });
  overlay.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive: false });
  document.body.appendChild(overlay);

  // Nonaktifkan kontrol inti untuk jaga-jaga.
  document.getElementById('wilayahSelect').disabled = true;
  document.getElementById('korwilInput').disabled = true;
  document.getElementById('korwilCard').style.display = 'none';
  document.getElementById('searchCard').style.display = 'none'; // Sembunyikan kotak pencarian setelah sukses

  const rows = Object.keys(selectedNamesMap).map(function(id, i){
    return '<div class="item-terpilih">'
      + '<span class="no">' + (i + 1) + '.</span>'
      + '<span class="nama">' + escapeHtml(selectedNamesMap[id] || id) + '</span>'
    + '</div>';
  }).join('');

  document.getElementById('listArea').innerHTML =
    '<div class="card locked-screen">'
      + '<div class="icon">✅</div>'
      + '<h2>Pemilihan Selesai</h2>'
      + '<p>' + escapeHtml(message || 'Data berhasil disimpan.') + '</p>'
      + '<p>Wilayah: <strong>' + escapeHtml(wilayah) + '</strong></p>'
    + '</div>';

  document.getElementById('terpilihArea').innerHTML =
    '<div class="section-title terpilih">' + JUMLAH_WAJIB + ' KK Terpilih (Terkunci)</div>'
    + '<div class="card">' + rows + '</div>';

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sudah Disubmit — Layar Terkunci';
}

// ---------------------------------------------------------
// FUNGSI BARU: PENCARIAN REAL-TIME
// ---------------------------------------------------------
function filterPencarian(){
  try {
    const input = document.getElementById('searchInput');
    const filter = input.value.toLowerCase(); // Merubah huruf jadi kecil agar tidak sensitif kapital
    const listArea = document.getElementById('listArea');
    const items = listArea.getElementsByClassName('item');
    
    let countVisible = 0;
    // Cek satu per satu kotak nama yang ada
    for (let i = 0; i < items.length; i++) {
      const namaEl = items[i].getElementsByClassName('nama')[0];
      if (namaEl) {
        const textValue = namaEl.textContent || namaEl.innerText;
        // Jika teks nama mengandung huruf yang diketik, maka tampilkan
        if (textValue.toLowerCase().indexOf(filter) > -1) {
          items[i].style.display = ""; // Tampilkan kotak
          countVisible++;
        } else {
          items[i].style.display = "none"; // Sembunyikan kotak
        }
      }
    }
    console.log("Filter dijalankan: '" + filter + "', ditemukan " + countVisible + " nama.");
  } catch (err) {
    console.log("Error saat pencarian: " + err.message);
  }
}
</script>
