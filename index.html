<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Status Pendistribusian Amplop YASSA</title>
<style>
  :root{
    --bg:#E0E5EC;
    --shadow-out: 9px 9px 16px rgba(163,177,198,0.6), -9px -9px 16px rgba(255,255,255,0.8);
    --shadow-in: inset 4px 4px 8px rgba(163,177,198,0.6), inset -4px -4px 8px rgba(255,255,255,0.8);
    --blue:#2563eb;
    --red:#dc2626;
    --green:#166534;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:16px; background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:#334155;
  }
  .container{max-width:640px; margin:0 auto;}
  h1{font-size:18px; font-weight:800; text-align:center; margin:8px 0 4px;}
  .subtitle{text-align:center; font-size:13px; font-weight:700; color:var(--blue); margin-bottom:4px;}
  .subtitle2{text-align:center; font-size:11.5px; color:#64748b; margin-bottom:20px;}

  .card{
    background:var(--bg); border-radius:20px; box-shadow:var(--shadow-out);
    padding:18px; margin-bottom:16px;
  }

  .stats{ display:flex; gap:10px; margin-bottom:16px; }
  .stat{
    flex:1; text-align:center; background:var(--bg); border-radius:16px;
    box-shadow:var(--shadow-out); padding:14px 8px;
  }
  .stat .num{ font-size:22px; font-weight:800; }
  .stat .lbl{ font-size:10.5px; color:#64748b; font-weight:700; text-transform:uppercase; margin-top:2px; }
  .stat.belum .num{ color:var(--red); }
  .stat.sudah .num{ color:var(--green); }
  .stat.total .num{ color:var(--blue); }

  .section-title{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
    color:#64748b; margin: 4px 0 8px;
  }

  .item{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-radius:14px; background:var(--bg);
    box-shadow:var(--shadow-out); margin-bottom:8px; border-left:3px solid var(--red);
  }
  .item .dot{ width:8px; height:8px; border-radius:50%; background:var(--red); flex-shrink:0; }
  .item .nama{ font-weight:700; font-size:13.5px; color:#1e293b; }

  .empty-msg{ text-align:center; font-size:12.5px; color:#166534; font-weight:700; padding:20px 0; }
  .loading{ text-align:center; font-size:12.5px; color:#94a3b8; padding:16px 0; }
  .spinner{
    display:inline-block; width:16px; height:16px; border:2px solid #cbd5e1;
    border-top-color: var(--blue); border-radius:50%; animation:spin .7s linear infinite;
    margin-right:8px; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#1e293b; color:#fff; padding:12px 20px; border-radius:12px;
    font-size:13px; max-width:90%; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    z-index:999; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .toast.error{background:#991b1b;}

  button.refresh-btn{
    width:100%; padding:14px; border:none; border-radius:16px;
    background:var(--bg); box-shadow:var(--shadow-out);
    font-weight:800; font-size:13px; color:var(--blue); cursor:pointer;
    margin-top:4px;
  }
  button.refresh-btn:active{ box-shadow:var(--shadow-in); }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Admin - Status Wilayah</h1>
  <div class="subtitle" id="periodeLabel">Memuat periode...</div>
  <div class="subtitle2">Wilayah yang sudah isi TIDAK ditampilkan di daftar bawah</div>

  <div class="stats" id="statsArea"></div>

  <div class="section-title">Wilayah Belum Isi</div>
  <div id="listArea"><div class="loading"><span class="spinner"></span>Memuat data...</div></div>

  <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===========================================================
// GANTI DENGAN URL WEB APP APPS SCRIPT YANG SAMA DENGAN
// index_10_amplop.html (satu backend, dua halaman frontend).
// ===========================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxNHEyje-MrlAbOKIrDy8YRTJ4Jltmo3xdpL1_5dGgvF-KuEWfH31uc-xUVJhTmd19U_A/exec';

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

async function apiGet(action, params){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString(), { method: 'GET' });
  const json = await res.json();
  if (!json.success) throw new Error(json.message || 'Terjadi kesalahan.');
  return json.data;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

window.onload = loadData;

function loadData(){
  document.getElementById('listArea').innerHTML = '<div class="loading"><span class="spinner"></span>Memuat data...</div>';
  apiGet('getWilayahBelumIsiPeriode')
    .then(render)
    .catch(function(err){
      showToast(err.message || 'Gagal memuat data.', true);
      document.getElementById('listArea').innerHTML = '';
    });
}

function render(data){
  document.getElementById('periodeLabel').textContent = 'Periode: ' + data.label;

  document.getElementById('statsArea').innerHTML =
    '<div class="stat total"><div class="num">' + data.totalWilayah + '</div><div class="lbl">Total</div></div>'
    + '<div class="stat sudah"><div class="num">' + data.totalSudah + '</div><div class="lbl">Sudah</div></div>'
    + '<div class="stat belum"><div class="num">' + data.totalBelum + '</div><div class="lbl">Belum</div></div>';

  const area = document.getElementById('listArea');
  if (data.daftarBelum.length === 0){
    area.innerHTML = '<div class="card"><div class="empty-msg">✅ Semua wilayah sudah isi periode ini.</div></div>';
    return;
  }

  area.innerHTML = data.daftarBelum.map(function(w){
    return '<div class="item"><span class="dot"></span><span class="nama">' + escapeHtml(w) + '</span></div>';
  }).join('');
}
</script>
</body>
</html>
